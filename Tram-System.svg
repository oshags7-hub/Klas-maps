<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <defs>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#eef0f3"/>

  <!-- ── Background context (roads / terminal massing, simplified) ── -->
  <g fill="#d8dbe0">
    <rect x="40" y="30" width="300" height="230" rx="14"/>
    <ellipse cx="330" cy="55" rx="20" ry="28" fill="#bcd9ea"/>
    <rect x="760" y="15" width="460" height="170" rx="14"/>
    <rect x="900" y="190" width="160" height="70" rx="8"/>
  </g>
  <g fill="none" stroke="#c7cad0" stroke-width="34" stroke-linecap="round" opacity="0.7">
    <path d="M40,170 C220,150 320,120 420,80"/>
    <path d="M420,80 C520,40 650,30 800,55"/>
  </g>

  <!-- ── D Gates pier spokes (drawn first, under everything) ── -->
  <g fill="#e3e5e9" stroke="#c7cad0" stroke-width="2">
    <rect x="828" y="545" width="120" height="30" rx="6" transform="rotate(-45 930 560)"/>
    <rect x="828" y="545" width="120" height="30" rx="6" transform="rotate(45 930 560)"/>
    <rect x="828" y="545" width="120" height="30" rx="6" transform="rotate(135 930 560)"/>
    <rect x="828" y="545" width="120" height="30" rx="6" transform="rotate(225 930 560)"/>
  </g>

  <!-- ══════════ TRAM LINES (color-coded by name) ══════════ -->

  <!-- GREEN LINE -->
  <path d="M340,375 C362,430 400,500 432,565 C 458,615 480,662 497,705"
        stroke="#1a7f37" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M340,375 C362,430 400,500 432,565 C 458,615 480,662 497,705"
        stroke="#ffffff" stroke-width="2" fill="none" stroke-dasharray="13 11" opacity="0.85"/>
  <g transform="translate(355,545) rotate(62)">
    <rect x="-58" y="-13" width="116" height="26" rx="13" fill="#1a7f37"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" letter-spacing="0.5">GREEN LINE</text>
  </g>

  <!-- BLUE LINE -->
  <path d="M400,512 C500,524 610,532 712,536 C 790,539 850,544 893,549"
        stroke="#1257d6" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M400,512 C500,524 610,532 712,536 C 790,539 850,544 893,549"
        stroke="#ffffff" stroke-width="2" fill="none" stroke-dasharray="13 11" opacity="0.85"/>
  <g transform="translate(650,517)">
    <rect x="-52" y="-13" width="104" height="26" rx="13" fill="#1257d6"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" letter-spacing="0.5">BLUE LINE</text>
  </g>

  <!-- RED LINE -->
  <path d="M935,512 C946,460 951,402 957,355 C 959,332 960,310 959,292"
        stroke="#d31f2f" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M935,512 C946,460 951,402 957,355 C 959,332 960,310 959,292"
        stroke="#ffffff" stroke-width="2" fill="none" stroke-dasharray="13 11" opacity="0.85"/>
  <g transform="translate(990,420) rotate(-83)">
    <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#d31f2f"/>
    <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="800" letter-spacing="0.5">RED LINE</text>
  </g>

  <!-- Pedestrian tunnel between trams (not a tram line — dashed gray) -->
  <path d="M905,402 L957,345" stroke="#7a818c" stroke-width="4" fill="none" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- ══════════ TERMINAL MARKERS ══════════ -->

  <!-- Terminal 1 A,B,C Gates -->
  <g filter="url(#pinShadow)">
    <rect x="232" y="402" width="56" height="56" rx="8" fill="#4f7cff" transform="rotate(45 260 430)"/>
    <text x="260" y="439" text-anchor="middle" font-size="22" fill="#fff">&#9992;</text>
  </g>
  <text x="260" y="480" text-anchor="middle" font-size="20" font-weight="800" fill="#16234a">Terminal 1</text>
  <text x="260" y="503" text-anchor="middle" font-size="20" font-weight="800" fill="#16234a">A, B, C Gates</text>

  <!-- D Gates -->
  <g filter="url(#pinShadow)">
    <rect x="902" y="532" width="56" height="56" rx="8" fill="#4f7cff" transform="rotate(45 930 560)"/>
    <text x="930" y="569" text-anchor="middle" font-size="22" fill="#fff">&#9992;</text>
  </g>
  <text x="930" y="612" text-anchor="middle" font-size="22" font-weight="800" fill="#16234a">D Gates</text>

  <!-- Terminal 3 E Gates -->
  <g filter="url(#pinShadow)">
    <rect x="937" y="232" width="56" height="56" rx="8" fill="#4f7cff" transform="rotate(45 965 260)"/>
    <text x="965" y="269" text-anchor="middle" font-size="22" fill="#fff">&#9992;</text>
  </g>
  <text x="965" y="312" text-anchor="middle" font-size="20" font-weight="800" fill="#16234a">Terminal 3 E Gates</text>

</svg>
